name: labeler

# Adds path labels to a pull request from .github/labeler.yml.
# docs/risk-tiers.md maps each label to the review it needs.
#
# pull_request_target runs in the context of the base branch, so a pull
# request from a fork can be labelled. That is safe here only because this
# job never checks out or runs the pull request's code: actions/labeler
# reads the list of changed files from the API. Do not add a checkout step.
#
# Like the other workflows, this binds nothing unless set as a required
# status check. It is not meant to be one: a label decides nothing.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Least privilege: read the configuration, write labels, nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit, with its release tag in the trailing
      # comment: a pinned version MUST be exact (docs/security-posture.md,
      # section 7, the runner).
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
