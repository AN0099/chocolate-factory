name: ci

# The test matrix: tests/run on Linux and macOS, where sed, grep and the
# shell differ. A macOS failure is a finding about the scripts, not a reason
# to loosen a gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test suite
        run: ./tests/run
