name: ai-fix

# Acknowledges the ai-fix label on an issue and routes the issue to the desk.
# This is the thin form recorded in docs/acmm.md: no agent runs here, no API
# secret is held, and nothing is written to the repository. A person picks
# the issue up, and any fix arrives as an ordinary pull request under the
# usual review (docs/risk-tiers.md).
#
# The comment text is fixed. Nothing from the issue (title, body, labels other
# than the one matched) is placed in a shell command, so issue text cannot
# inject into the run step.
#
# Like the other workflows, this binds nothing: a label decides nothing.
#
# The label name is a contract with the `gh label create ai-fix` command in
# docs/acmm.md, "L4: the second change": renaming the label makes this
# workflow do nothing.

on:
  issues:
    types: [labeled]

# Least privilege: the token is limited to issues, and the step only comments.
permissions:
  issues: write

jobs:
  route:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acknowledge once and route to the desk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          marker='<!-- ai-fix-ack -->'
          # Only the bot's own comments count, so a planted marker cannot
          # suppress the reply. Captured first, so a failed read fails the
          # step instead of posting; --paginate reads every comment.
          bodies=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          # No pipe, so pipefail cannot turn a match into a post.
          if case "$bodies" in *"$marker"*) true;; *) false;; esac; then
            echo "already acknowledged"
            exit 0
          fi
          gh issue comment "$NUMBER" --repo "$REPO" --body "$marker
          Label \`ai-fix\` received. This repository runs no agent in CI: the issue is routed to the maintainers' desk, and any fix arrives as a pull request under the usual review. See \`docs/acmm.md\`."
