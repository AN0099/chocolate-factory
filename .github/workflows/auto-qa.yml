name: auto-qa

# Proposes job timeouts from this repository's own run history, weekly. It
# reads the last 100 runs of each workflow it tunes and writes the proposals to the job summary; it
# never edits a workflow. Accept a proposal by changing the workflow and
# .github/auto-qa-tuning.json in a pull request. The policy, and why the
# gates themselves are never tuned, are in scripts/auto-qa-tuner.py.
#
# Run the same thing yourself: the commands are in the script's header.

on:
  schedule:
    # Once a week, Monday, UTC.
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  propose:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Pinned by tag, not by digest, as in gates.yml. See
      # docs/security-posture.md, row 3.7.
      - uses: actions/checkout@v7

      - name: Tuner selftest
        run: python3 -I scripts/auto-qa-tuner.py --selftest

      # One list per workflow, so a weekly workflow's runs are not crowded out
      # of a shared window by busier ones. bash gives pipefail.
      - name: Read run history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in $(python3 -I scripts/auto-qa-tuner.py --workflows); do
            gh run list -w "$w" -L 100 --json workflowName,conclusion,startedAt,updatedAt
          done | jq -s add > "$RUNNER_TEMP/runs.json"

      - name: Propose
        run: python3 -I scripts/auto-qa-tuner.py "$RUNNER_TEMP/runs.json" >> "$GITHUB_STEP_SUMMARY"
