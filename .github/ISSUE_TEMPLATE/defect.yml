name: Defect
description: Something in this repository does not do what it says.
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file, and the line or section if you have it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Quote the document or rule if there is one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: A command or sequence someone else can run.
