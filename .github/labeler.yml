# Path labels for pull requests, read by .github/workflows/labeler.yml.
#
# Each label names the area a change touches. docs/risk-tiers.md maps the
# labels to the review each area needs. A label is a prompt for the reviewer
# and decides nothing.
#
# Format: actions/labeler v5 and later, one entry per label, matched on the
# files a pull request changes.

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - 'LICENSE'
          - 'CITATION.cff'
          - 'corrections.jsonl'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/**'

skills:
  - changed-files:
      - any-glob-to-any-file:
          - 'skills/**'

hooks:
  - changed-files:
      - any-glob-to-any-file:
          - 'hooks/**'

# Agent harness settings, reviewed with skills and hook rules.
agent-config:
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**'
          - '.cursor/**'

orchestration:
  - changed-files:
      - any-glob-to-any-file:
          - 'orchestration/**'

# redaction-gate is a gate as well as a skill: SECURITY.md names a gate that
# fails open as the highest severity defect. The markdownlint configuration
# files are the configuration of a CI gate.
gates:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'
          - 'tests/**'
          - '.githooks/**'
          - 'skills/redaction-gate/**'
          - '.markdownlint-cli2.jsonc'
          - 'skills/.markdownlint-cli2.jsonc'

workflows:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
